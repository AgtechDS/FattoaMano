<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a679" />
      <stop offset="50%" stop-color="#c87d55" />
      <stop offset="100%" stop-color="#8a3f1a" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c1c24" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </radialGradient>
    <filter id="copperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base with Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#copperGrad)" stroke-width="2" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#c87d55" stroke-opacity="0.25" stroke-width="1" />

  <!-- Luxury Artisan Crest: Stylized Interlocking Monogram 'FM' -->
  <g filter="url(#copperGlow)">
    <!-- Letter F -->
    <path d="M 18 46 L 18 18 L 33 18 L 33 22 L 23 22 L 23 30 L 30 30 L 30 34 L 23 34 L 23 46 Z" fill="url(#copperGrad)" />
    
    <!-- Letter M intertwined with subtle offset -->
    <path d="M 31 46 L 31 24 L 37 38 L 41 38 L 47 24 L 47 46 L 43 46 L 43 32 L 39.5 40 L 38.5 40 L 35 32 L 35 46 Z" fill="url(#copperGrad)" />

    <!-- Top Spark / Flame Dot (Artisan Forge Touch) -->
    <circle cx="39" cy="18" r="2.2" fill="#ffd1b3" />
  </g>
</svg>
